<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07111f"><title>Weather — My Location Info</title><link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/weather.css"><link rel="stylesheet" href="css/responsive.css"></head><body><div class="app"><header class="app-header"><a class="header-home-button" href="index.html" aria-label="Home">🏠</a><div class="app-header__title"><h1>My Location Info</h1><p>What's happening here?</p></div><button class="header-button" type="button" aria-label="Page information">i</button></header><main class="page"><section class="page-hero"><div class="page-hero__line"><div class="page-hero__icon">🌦️</div><div><h2>Weather</h2><p>What's happening here?</p></div></div></section><div class="card weather-location"><div><div class="weather-location__name">Current GPS position</div><span class="status-dot"></span></div><div class="weather-location__updated" id="weatherUpdated">Waiting for weather</div></div><div class="card weather-main"><button class="weather-refresh" onclick="location.reload()">↻</button><div class="weather-main__icon" id="weatherIcon">🌤️</div><div class="weather-temp" id="weatherTemp">—</div><div class="weather-condition" id="weatherCondition">Waiting for data</div><div class="weather-feels" id="weatherFeels">—</div></div><div class="weather-grid"><div class="card weather-card"><div class="label">Humidity</div><div class="value" id="humidity">—</div><div class="sub">relative humidity</div></div><div class="card weather-card"><div class="label">Wind</div><div class="value" id="wind">—</div><div class="sub">10 m wind</div></div><div class="card weather-card"><div class="label">Precipitation</div><div class="value" id="rain">—</div><div class="sub">current</div></div><div class="card weather-card"><div class="label">Provider</div><div class="value" id="provider">—</div><div class="sub">fallback-ready</div></div></div><script src="js/services/weather-service.js"></script><script>(function(){const codes={0:["☀️","Clear"],1:["🌤️","Mainly clear"],2:["⛅","Partly cloudy"],3:["☁️","Overcast"],45:["🌫️","Fog"],51:["🌦️","Drizzle"],53:["🌦️","Drizzle"],55:["🌧️","Drizzle"],61:["🌦️","Rain"],63:["🌧️","Rain"],65:["🌧️","Heavy rain"],80:["🌦️","Showers"],81:["🌧️","Showers"],82:["🌧️","Heavy showers"],95:["⛈️","Thunderstorm"]};function render(r){if(!r)return;const c=r.current||{};document.getElementById("weatherTemp").textContent=c.temperature_2m!=null?Math.round(c.temperature_2m)+"°C":"—";document.getElementById("weatherFeels").textContent=c.apparent_temperature!=null?"Feels like "+Math.round(c.apparent_temperature)+"°C":"—";const d=c.weather_code!=null?(codes[c.weather_code]||["🌦️","Weather"]):["🌦️","Weather"];document.getElementById("weatherIcon").textContent=d[0];document.getElementById("weatherCondition").textContent=d[1];document.getElementById("humidity").textContent=c.relative_humidity_2m!=null?c.relative_humidity_2m+"%":"—";document.getElementById("wind").textContent=c.wind_speed_10m!=null?Math.round(c.wind_speed_10m)+" km/h":"—";document.getElementById("rain").textContent=c.precipitation!=null?c.precipitation+" mm":"—";document.getElementById("provider").textContent=r.provider+(r.stale?" • cached":"");document.getElementById("weatherUpdated").textContent=r.stale?"Last saved weather":"Updated now"}if(window.MyLocationGPS)MyLocationGPS.subscribe(s=>{const p=s.position?.coords;if(p)MLIWeatherService.resolve(p.latitude,p.longitude).then(render)})})();</script></main><nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item" data-color="green" href="position.html"><span class="nav-icon">⌖</span><span>Position</span></a><a class="nav-item" data-color="blue" href="gps-data.html"><span class="nav-icon">◉</span><span>GPS Data</span></a><a class="nav-item" data-color="gold" href="address.html"><span class="nav-icon">▣</span><span>Address</span></a><a class="nav-item active" data-color="purple" href="weather.html"><span class="nav-icon">☁</span><span>Weather</span></a></nav></div><script src="js/api-config.js"></script><script src="js/gps-core.js"></script><script src="js/offline-cache.js"></script><script src="js/icon-service.js"></script><script src="js/services/thumbnail-service.js"></script><script src="js/app.js"></script></body></html>
