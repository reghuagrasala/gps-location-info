<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0c0d11"><title>GPS Data — My Location Info</title><link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/gps-data.css"><link rel="stylesheet" href="css/responsive.css"></head><body><div class="app gps-data-page"><header class="app-header"><a class="header-home-button" href="index.html" aria-label="Home">🏠</a><div class="app-header__title"><h1>GPS DATA</h1><p>Offline device GPS</p></div><button class="header-button" type="button" aria-label="Information">i</button></header><main class="page gps-only-page"><div class="gps-digipin">DIGIPIN: <span id="digipin">—</span></div><section class="gps-data-grid" aria-label="Offline GPS data"><article class="gps-data-card"><span class="gps-data-label">latitude</span><span class="gps-data-symbol">◎</span><strong id="latitude">—</strong></article><article class="gps-data-card"><span class="gps-data-label">heading</span><button class="heading-activate" id="headingActivate" aria-label="Activate heading">➜</button><strong id="heading">—</strong></article><article class="gps-data-card"><span class="gps-data-label">date</span><span class="gps-data-symbol">□</span><strong id="date">—</strong></article><article class="gps-data-card"><span class="gps-data-label">longitude</span><span class="gps-data-symbol">◎</span><strong id="longitude">—</strong></article><article class="gps-data-card"><span class="gps-data-label">accuracy</span><span class="gps-data-symbol">◎</span><strong id="accuracy">—</strong></article><article class="gps-data-card"><span class="gps-data-label">time</span><span class="gps-data-symbol">◷</span><strong id="time">—</strong></article><article class="gps-data-card"><span class="gps-data-label">elevation</span><span class="gps-data-symbol">▲</span><strong id="elevation">—</strong></article><article class="gps-data-card"><span class="gps-data-label">speed</span><span class="gps-data-symbol">◷</span><strong id="speed">—</strong></article><article class="gps-data-card"><span class="gps-data-label">time zone</span><span class="gps-data-symbol">◷</span><strong id="timezone">—</strong></article></section><div class="gps-offline-note">GPS data is measured by the device and remains available without internet.</div></main><nav class="bottom-nav" aria-label="Main navigation"><a class="nav-item" data-color="green" href="position.html"><span class="nav-icon">⌖</span><span>Position</span></a><a class="nav-item active" data-color="blue" href="gps-data.html"><span class="nav-icon">◉</span><span>GPS Data</span></a><a class="nav-item" data-color="gold" href="address.html"><span class="nav-icon">▣</span><span>Address</span></a><a class="nav-item" data-color="purple" href="weather.html"><span class="nav-icon">☁</span><span>Weather</span></a></nav></div><script src="js/gps-core.js"></script><script src="js/offline-cache.js"></script><script src="js/app.js"></script><script>
(function(){
 const $=id=>document.getElementById(id), dirs=["N","NE","E","SE","S","SW","W","NW"];
 let sensorHeading=null, headingActive=false;
 function dir(h){return dirs[Math.round(h/45)%8]}
 function showHeading(h){if(h==null||isNaN(h))return;h=((h%360)+360)%360;sensorHeading=h;$("heading").textContent=Math.round(h)+"° ("+dir(h)+")"}
 function handleOrientation(e){let h=null;if(typeof e.webkitCompassHeading==="number"&&isFinite(e.webkitCompassHeading))h=e.webkitCompassHeading;else if(typeof e.alpha==="number"){h=(360-e.alpha)%360;if(screen.orientation&&typeof screen.orientation.angle==="number")h=(h+screen.orientation.angle)%360}showHeading(h)}
 async function activateHeading(){
   const b=$("headingActivate");
   try{
     if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
       const p=await DeviceOrientationEvent.requestPermission(); if(p!=="granted"){b.classList.remove("on");return}
     }
     window.addEventListener("deviceorientationabsolute",handleOrientation,true);
     window.addEventListener("deviceorientation",handleOrientation,true);
     headingActive=true;b.classList.add("on");b.textContent="➜";
   }catch(e){b.classList.remove("on")}
 }
 $("headingActivate").addEventListener("click",activateHeading);
 function render(s){
   const p=s.position?.coords;if(!p)return;
   $("latitude").textContent=p.latitude.toFixed(6)+"° "+(p.latitude>=0?"N":"S");
   $("longitude").textContent=Math.abs(p.longitude).toFixed(6)+"° "+(p.longitude>=0?"E":"W");
   $("accuracy").textContent=p.accuracy!=null?Math.round(p.accuracy)+" m":"—";
   $("elevation").textContent=p.altitude!=null?Math.round(p.altitude)+" m":"—";
   $("speed").textContent=p.speed!=null&&p.speed>=0?(p.speed*3.6).toFixed(1)+" km/h":"0.0 km/h";
   const d=new Date(s.position.timestamp||Date.now());
   $("date").textContent=String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getFullYear()).slice(-2);
   $("time").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
   const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"Local";
   const off=-d.getTimezoneOffset(), sign=off>=0?"+":"-", ah=Math.floor(Math.abs(off)/60), am=Math.abs(off)%60;
   $("timezone").textContent=tz+" GMT"+sign+ah+(am?":"+String(am).padStart(2,"0"):"");
   if(p.heading!=null&&p.heading>=0&&!headingActive)showHeading(p.heading);
 }
 MyLocationGPS.subscribe(render);
 setInterval(()=>{const s=MyLocationGPS.getState();if(s.position)render(s)},1000);
})();
</script></body></html>
